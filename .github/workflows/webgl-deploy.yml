name: Build & Deploy WebGL to GitHub Pages

# Builds the Unity project for WebGL on every push to unity-client and publishes it
# to GitHub Pages, so the game is playable in a browser at:
#   https://<owner>.github.io/Enroute/
#
# ONE-TIME SETUP REQUIRED before this will work — a Unity Personal license,
# free (Unity no longer allows the old offline .alf/.ulf activation-request flow
# for Personal/Pro seats, only Enterprise/Industry, so this uses the .ulf your
# local, already-activated Unity install already has, on macOS normally at
# "/Library/Application Support/Unity/Unity_lic.ulf"):
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository secret:
#        UNITY_LICENSE = the full contents of that local Unity_lic.ulf file
#   2. Also add (used together with the license file by game-ci):
#        UNITY_EMAIL    = the email of your Unity ID account
#        UNITY_PASSWORD = that account's password
#   3. If that Unity account has two-factor authentication enabled, also add:
#        UNITY_TOTP_SECRET = the account's TOTP seed (from when 2FA was set up)
#   4. Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#      (already done once via the API — nothing to do here unless it was reset).
#
# Without step 1, every run of this workflow fails at the "Build WebGL" step with
# "Missing Unity License File and no Serial was found" — that's expected until
# the UNITY_LICENSE secret is added.
on:
  push:
    branches: [unity-client]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_SECRET: ${{ secrets.UNITY_TOTP_SECRET }}
        with:
          unityVersion: 6000.3.25f1
          targetPlatform: WebGL
          buildsPath: build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
